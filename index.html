<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ENZOPONIK" />
  <meta name="application-name" content="ENZOPONIK" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="ENZOPONIK - Smart Vertical Cocopeat Hydroponic Monitor" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <title>ENZOPONIK</title>
  <style>
    #boot-splash {
      position: fixed;
      inset: -60px 0;
      z-index: 2147483646;
      background: #ffffff;
      pointer-events: none;
    }

    html.boot-splash-bg,
    html.boot-splash-bg body {
      background-color: #ffffff !important;
    }

    html.boot-splash-bg #root {
      visibility: hidden;
    }
  </style>
</head>

<body>
  <div id="boot-splash" aria-hidden="true"></div>
  <script>
    try {
      if (sessionStorage.getItem('enzoponik_splash_shown')) {
        document.getElementById('boot-splash')?.remove();
      } else {
        document.documentElement.classList.add('boot-splash-bg');
      }
    } catch {
      document.getElementById('boot-splash')?.remove();
    }
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
